# Symlinks: the left side is a path in this repo, the right side is relative to $HOME.
# When the right side ends with /, every item matching the glob on the left is linked into that directory.

# shell / git / vim
.zshrc                                .zshrc
.bashrc                               .bashrc
.gitconfig                            .gitconfig
.gitignore_global                     .gitignore_global
.vimrc                                .vimrc
.gvimrc                               .gvimrc

# ~/.config
.config/ghostty                       .config/ghostty
.config/herdr/config.toml             .config/herdr/config.toml
.config/karabiner/karabiner.json      .config/karabiner/karabiner.json
.config/mise/config.toml              .config/mise/config.toml

# Claude Code (default profile)
agent-config/claude__settings.json    .claude/settings.json
agent-config/claude__CLAUDE.md        .claude/CLAUDE.md
agent-config/skills/*                 .claude/skills/

# Claude Code (CLAUDE_CONFIG_DIR=~/.claude-api)
agent-config/claude__settings.json    .claude-api/settings.json
agent-config/claude__CLAUDE.md        .claude-api/CLAUDE.md
agent-config/skills/*                 .claude-api/skills/

# Codex
agent-config/codex__AGENTS.md         .codex/AGENTS.md
agent-config/skills/*                 .codex/skills/

# CLI
bin/dotfiles                          .local/bin/dotfiles
