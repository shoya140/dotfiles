onboarding = false

[ui.sound]
enabled = false

[ui]
agent_panel_sort = "spaces"
prompt_new_tab_name = false
hide_tab_bar_when_single_tab = true

[keys]
prefix = "ctrl+a"
detach = ["prefix+d"]
split_horizontal = ["prefix+minus", "alt+shift+d"]
split_vertical = ["prefix+=", "alt+d"]
new_tab = ["prefix+t", "alt+t"]
new_workspace = ["prefix+n", "alt+n"]
close_pane = ["prefix+w", "alt+w"]
switch_workspace = "alt+1..9"
toggle_sidebar = ["prefix+\\", "alt+\\"]
