# macOS system settings written through `defaults`.
#
#   [domain]                 domain for the lines that follow
#   [domain -currentHost]    read and written with `defaults -currentHost`
#   key  type  value         type is bool / int / float / string
#
# apply:  dotfiles macos      writes only the values that differ
# check:  dotfiles check      compares every value with this machine
# adopt:  dotfiles sync       rewrites the values here from this machine
# Some settings take effect only after logout or restart.

# ------------------------------------------------------------
# Keyboard
# ------------------------------------------------------------
[NSGlobalDomain]
# Key repeat faster than the fastest setting in System Settings
KeyRepeat                               int     2
InitialKeyRepeat                        int     15
# Repeat the key when held instead of showing the accent menu
ApplePressAndHoldEnabled                bool    false
# No automatic substitution of dashes, periods and quotes
NSAutomaticDashSubstitutionEnabled      bool    false
NSAutomaticPeriodSubstitutionEnabled    bool    false
NSAutomaticQuoteSubstitutionEnabled     bool    false
# Hide the input source indicator that pops up in the middle of the screen
TSMLanguageIndicatorEnabled             bool    false

# ------------------------------------------------------------
# Appearance
# ------------------------------------------------------------
# Dark mode
AppleInterfaceStyle                     string  Dark

# ------------------------------------------------------------
# Trackpad
# ------------------------------------------------------------
# Tracking speed
com.apple.trackpad.scaling              float   0.875

# Tap to click (written for the built-in trackpad, Bluetooth trackpads and the login screen)
[NSGlobalDomain -currentHost]
com.apple.mouse.tapBehavior             int     1

[com.apple.AppleMultitouchTrackpad]
Clicking                                bool    true
# Three finger drag
TrackpadThreeFingerDrag                 bool    true

[com.apple.driver.AppleBluetoothMultitouch.trackpad]
Clicking                                bool    true
TrackpadThreeFingerDrag                 bool    true

# ------------------------------------------------------------
# Dock
# ------------------------------------------------------------
[com.apple.dock]
# Hide the Dock automatically
autohide                                bool    true
# Small icons that magnify under the cursor
tilesize                                int     27
magnification                           bool    true
largesize                               int     46
# Do not show recent applications
show-recents                            bool    false
# Hot corner: bottom right puts the display to sleep (no modifier)
wvous-br-corner                         int     10
wvous-br-modifier                       int     0

# ------------------------------------------------------------
# Desktop and windows
# ------------------------------------------------------------
[com.apple.WindowManager]
# Click wallpaper to reveal desktop only in Stage Manager
EnableStandardClickToShowDesktop        bool    false
# No margins between tiled windows
EnableTiledWindowMargins                bool    false

# ------------------------------------------------------------
# Finder
# ------------------------------------------------------------
[com.apple.finder]
# Show hidden files
AppleShowAllFiles                       bool    true
# List view by default
FXPreferredViewStyle                    string  Nlsv
# New windows open the home directory
NewWindowTarget                         string  PfHm
# Show only external disks and removable media on the desktop
ShowHardDrivesOnDesktop                 bool    false
ShowExternalHardDrivesOnDesktop         bool    true
ShowRemovableMediaOnDesktop             bool    true

# ------------------------------------------------------------
# Screenshots
# ------------------------------------------------------------
[com.apple.screencapture]
# No floating thumbnail after taking a screenshot
show-thumbnail                          bool    false

# ------------------------------------------------------------
# Menu bar
# ------------------------------------------------------------
[com.apple.menuextra.clock]
# Show the day of week in the clock, hide the date
ShowDayOfWeek                           bool    true
ShowDate                                bool    false

[com.apple.controlcenter -currentHost]
# Always show Bluetooth in the menu bar
Bluetooth                               int     18
