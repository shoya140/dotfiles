# herdr's Claude Code integration and plugins live outside its package
[bootstrap.hooks]
post-packages = '''
command -v herdr >/dev/null 2>&1 || exit 0
[ -f "$HOME/.claude/hooks/herdr-agent-state.sh" ] || herdr integration install claude
herdr plugin list 2>/dev/null | grep -q shibayu36.equalize-panes || herdr plugin install shibayu36/herdr-equalize-panes -y
'''

[bootstrap.macos.defaults.NSGlobalDomain]
# Trackpad tracking speed
"com.apple.trackpad.scaling" = 0.875

[bootstrap.macos.defaults."com.apple.AppleMultitouchTrackpad"]
Clicking = true
# Three finger drag
TrackpadThreeFingerDrag = true

[bootstrap.macos.defaults."com.apple.driver.AppleBluetoothMultitouch.trackpad"]
Clicking = true
TrackpadThreeFingerDrag = true

# Tap to click (written for the built-in trackpad, Bluetooth trackpads and the login screen)
[[bootstrap.macos.defaults_entries]]
domain = "NSGlobalDomain"
key = "com.apple.mouse.tapBehavior"
host = "current"
value = 1
